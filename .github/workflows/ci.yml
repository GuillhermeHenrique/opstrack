name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 . --count

      - name: Testes e cobertura (pytest)
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t opstrack:${{ github.sha }} .

      - name: Rodar container Docker
        run: |
          docker run -d --rm -p 8000:8000 --name opstrack-api opstrack:${{ github.sha }}
          sleep 5
          curl -fsS http://127.0.0.1:8000/status

      - name: Encerrar container
        if: always()
        run: docker stop opstrack-api